[project]
name = "spec-to-runtime"
version = "0.1.0"
description = "Agente Strands en Bedrock AgentCore derivado de specs AIUP"
readme = "README.md"
authors = [
    { name = "mau-cloud", email = "63675607+mauc-agentic@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aws-opentelemetry-distro>=0.10.1",
    "bedrock-agentcore>=1.23.1",
    "strands-agents>=1.57.0",
]

[project.scripts]
spec-to-runtime = "spec_to_runtime:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[dynamodb,sqs]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
