name: CI

on:
  pull_request:
  push:
    branches: [main]

# Token de solo lectura: ningún job escribe en el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pytest sale con 5 cuando aún no hay tests; se tolera hasta que exista el primer UC.
      - run: uv run pytest || [ $? -eq 5 ]

  terraform:
    name: terraform (fmt + validate + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
      - run: terraform fmt -check -recursive infra
      - run: |
          for d in infra infra/bootstrap; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx checkov -d infra --quiet --compact
